name: 気象庁から取得

on:
  schedule:
    # 3時間ごと（UTC）。直近の地震情報と、直近 refetch_days 日の速報を取り直す
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      command:
        description: '取得の種類（update / catalog 2019 2019 / daily 2024-01-01 2024-01-31 など）'
        required: false
        default: 'update'

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 検査
        run: |
          python3 -m unittest tests.test_jma
          TZ=America/New_York node tests/core.test.js
      - name: 取得
        id: fetch
        env:
          CMD: ${{ github.event.inputs.command || 'update' }}
        run: |
          set +e
          python3 scripts/fetch.py $CMD
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: 保存
        run: |
          git config user.name 'quake-fetch-bot'
          git config user.email 'quake-fetch-bot@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then echo '変化なし'; exit 0; fi
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ) ${{ github.event.inputs.command || 'update' }}"
          git push
      - name: 取得の失敗を知らせる
        if: steps.fetch.outputs.code != '0'
        run: |
          echo '一部の取得に失敗しました。data/manifest.json の errors を見てください。'
          exit 1
